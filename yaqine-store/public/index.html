function link(k){return S[k]||DEF[k]||''}
function contact(){
  const cards=[],ph=S.phone,em=S.email||DEF.email;
  if(S.whatsapp)cards.push(`<a class="cc" target="_blank" rel="noopener noreferrer" href="${wa('Bonjour, je voudrais des informations.')}"><div class="ic">${IC.wa}</div><b>${t('k_wa')}</b><span>${t('wa_hi')}</span></a>`);
  if(ph)cards.push(`<a class="cc" href="tel:${esc(ph.replace(/[^\d+]/g,''))}"><div class="ic">${IC.ph}</div><b>${t('k_phone')}</b><span dir="ltr">${esc(ph)}</span></a>`);
  if(em)cards.push(`<a class="cc" href="mailto:${esc(em)}"><div class="ic">${IC.ml}</div><b>${t('k_mail')}</b><span>${esc(em)}</span></a>`);
  if(S.address)cards.push(`<div class="cc"><div class="ic">${IC.pin}</div><b>${t('k_addr')}</b><span>${esc(S.address)}</span></div>`);
  if(S.hours)cards.push(`<div class="cc"><div class="ic">${IC.clk}</div><b>${t('k_hours')}</b><span>${esc(S.hours)}</span></div>`);
  $('#cgrid').innerHTML=cards.join('');
  const soc=[['instagram','Instagram',IC.ig],['facebook','Facebook',IC.fb],['tiktok','TikTok',IC.tt],['youtube','YouTube',IC.yt]].filter(x=>link(x[0])).map(x=>`<a href="${esc(link(x[0]))}" target="_blank" rel="noopener noreferrer" aria-label="${x[1]}" title="${x[1]}">${x[2]}</a>`).join('');
  $('#soc').innerHTML=soc;
  const n=$('#wa-nav');if(S.whatsapp){n.href=wa('Bonjour, je voudrais des informations.');n.target='_blank';n.rel='noopener'}else n.style.display='none';
}
function render(){
  $('#chips').innerHTML=['Tous','Homme','Femme','Coffrets'].map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${t(c)}</button>`).join('');
  const list=products.filter(p=>cat==='Tous'||p.category===cat);
  $('#grid').innerHTML=list.length?list.map((p,i)=>`
   <article class="card" style="animation-delay:${Math.min(i,8)*60}ms">
    <a class="cl" href="${purl(p)}" aria-label="${esc(p.name)}"></a>
    <div class="ph"><img src="/uploads/${p.image}" alt="${esc(p.name)}" loading="lazy" width="1200" height="1200">${p.soldOut?`<span class="tag">${t('sold')}</span>`:''}${p.size?`<span class="sz">${esc(p.size)}</span>`:''}</div>
    <div class="b"><h3>${esc(p.name)}</h3><p class="d">${esc(p.description)}</p>
    <div class="row"><span class="price">${DA(p.price)}</span>${p.soldOut?'':`<a class="btn" href="${purl(p)}#order">${t('order')}</a>`}</div></div>
   </article>`).join(''):`<p class="empty">${t('none')}</p>`;
}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#lang-t').textContent=t('other');
  document.title=lang==='ar'?'بوتيك يقين — عطور':'Boutique Yaquine — Parfums';
  render();contact();
}
$('#lang').onclick=()=>{lang=lang==='fr'?'ar':'fr';try{localStorage.lang=lang}catch(e){}applyLang()};
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;render()}};

applyLang();
Promise.all([fetch('/api/settings').then(r=>r.json()),fetch('/api/products').then(r=>r.json())]).then(([st,p])=>{S=st;products=p;pixels();applyLang()});
track();
</script>
</body>
</html>
